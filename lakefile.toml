name = "hex-roots-theory"
defaultTargets = ["HexRootsTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyZTheory"
git = "https://github.com/leanprover/hex-poly-z-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexRoots"
git = "https://github.com/leanprover/hex-roots.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexRootsTheory"

[[lean_lib]]
name = "HexRootsTheoryTests"
globs = ["HexRootsTheory.Examples"]
